[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "historical-framing-shifts-reproduction"
version = "0.1.0"
description = "Anonymous computational reproduction package for the accompanying paper"
requires-python = ">=3.12,<3.13"
dependencies = [
  "matplotlib==3.10.0",
  "numpy==2.0.2",
  "pandas==2.2.2",
  "pillow==12.3.0",
  "ruptures==1.1.10",
  "scipy==1.18.0",
  "seaborn==0.13.2",
]

[project.optional-dependencies]
full = [
  "accelerate==1.13.0",
  "datasets==3.6.0",
  "evaluate==0.4.6",
  "huggingface-hub==1.15.0",
  "spacy==3.8.7",
  "torch==2.10.0",
  "transformers==5.0.0",
]
notebook = [
  "ipykernel==6.29.5",
  "jupyter==1.1.1",
  "nbclient==0.10.2",
  "nbformat==5.10.4",
]
test = ["pytest==8.3.4"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
